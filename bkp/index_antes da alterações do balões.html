<!doctype html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central de Conhecimento — Cloud RM</title>
  <style>
    :root {
      --bg: #0b0f19; --card: #121a2a; --muted: #9aa7bd; --text: #e8eefc;
      --accent: #5aa7ff; --highlight: #ffe066; --border: rgba(255,255,255,.08);
      --breadcrumb: #20c997;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); background: rgba(11,15,25,.85); border-bottom: 1px solid var(--border); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 18px; }
    .pill { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 12px; }
    .searchRow { display: flex; gap: 10px; margin-top: 12px; }
    input[type="search"] { flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; outline: none; font-size: 15px; }
    main { padding: 18px 0 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    
    /* Estilização da linha de caminho / hierarquia */
    .breadcrumb { font-size: 11px; font-weight: 600; color: var(--breadcrumb); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; word-break: break-word; }
    
    .card h3 { margin: 0 0 8px; font-size: 16px; }
    .card a { color: var(--accent); text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .snippet { color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 8px; max-height: 120px; overflow: hidden; }
    mark { background: rgba(255, 224, 102, 0.25); color: var(--highlight); padding: 0 2px; border-radius: 2px; }
    .count { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .kbd { border: 1px solid var(--border); background: rgba(255,255,255,.04); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Central de Conhecimento — GERAL (Cloud RM)</div>
      <div class="pill">Busca com Mapeamento de Caminho</div>
      <div class="pill">Atalho: <span class="kbd">Ctrl</span> + <span class="kbd">K</span></div>
    </div>
    <div class="searchRow">
      <input id="q" type="search" placeholder="Buscar por erro, banco de dados, parâmetro, roteiro…" autocomplete="off" />
    </div>
    <div class="count" id="count">Carregando índice...</div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script src="./docs.js"></script>

<script>
  const SENHA_CORRETA = "redondo"; 

  function autenticar() {
    const acessoSalvo = localStorage.getItem("acesso_central_cloud");
    if (acessoSalvo === SENHA_CORRETA) return true;

    const senhaDigitada = prompt("Central de Conhecimento Cloud RM\n\nPor favor, digite a senha de acesso:");
    if (senhaDigitada === SENHA_CORRETA) {
      localStorage.setItem("acesso_central_cloud", SENHA_CORRETA);
      return true;
    } else {
      alert("Senha incorreta! Acesso negado.");
      document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>Acesso negado. Recarregue a página para tentar novamente.</h2>";
      return false;
    }
  }

  if (autenticar()) {
    const DOCS = (typeof DATA !== 'undefined' && DATA.docs) ? DATA.docs : [];
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const count = document.getElementById('count');

    function cleanText(s) {
      if (!s) return '';
      return s
        .normalize('NFD')
        .replace(/\p{Diacritic}/gu, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    const searchDocs = DOCS.map(d => ({
      ...d,
      cleanTitle: cleanText(d.title),
      cleanText: cleanText(d.text),
      cleanPath: cleanText(d.path || d.title)
    }));

    const fuse = new Fuse(searchDocs, {
      keys: [
        { name: 'cleanTitle', weight: 0.6 },
        { name: 'cleanPath', weight: 0.2 },
        { name: 'cleanText', weight: 0.2 }
      ],
      threshold: 0.25,
      distance: 100,
      ignoreLocation: true,
      minMatchCharLength: 3
    });

    function getSnippet(text, query) {
      if (!text) return '';
      if (!query) return text.substring(0, 160) + '...';
      
      const cleanT = cleanText(text);
      const cleanQ = cleanText(query).split(' ')[0];
      let index = cleanT.indexOf(cleanQ);

      if (index === -1) return text.substring(0, 160) + '...';
      
      const start = Math.max(0, index - 50);
      const end = Math.min(text.length, index + 110);
      return (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');
    }

    function render() {
      const rawQuery = q.value.trim();
      const query = cleanText(rawQuery);

      let results = [];

      if (!query) {
        results = searchDocs;
      } else {
        const exactMatches = searchDocs.filter(d => 
          d.cleanTitle.includes(query) || d.cleanPath.includes(query) || d.cleanText.includes(query)
        );
        const fuseMatches = fuse.search(query).map(r => r.item).filter(d => !exactMatches.includes(d));

        results = [...exactMatches, ...fuseMatches];
      }

      grid.innerHTML = results.map(d => `
        <div class="card">
          <div>
            <div class="breadcrumb">${d.path || 'GERAL'}</div>
            <h3><a href="${d.url || '#'}" target="_blank" rel="noopener">${d.title}</a></h3>
          </div>
          <div class="snippet">${getSnippet(d.text, rawQuery)}</div>
        </div>
      `).join('');

      count.textContent = `${results.length} resultado(s) encontrado(s)`;
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        q.focus();
      }
    });

    q.addEventListener('input', render);
    
    count.textContent = `${DOCS.length} documentações carregadas.`;
    render();
  }
</script>
</body>
</html>
